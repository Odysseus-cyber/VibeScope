[project]
name = "vibescope-backend"
version = "0.1.0"
description = "AI-built application trends data platform"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "apscheduler>=3.11,<4", "dbt-postgres>=1.9,<1.10", "dbt-core>=1.10,<1.11"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
